[project]
name = "leo-cli"
version = "0.1.0"
description = "L.E.O.C.O.D.E: the multi-agent LLM Efficiency Orchestrator in your terminal"
requires-python = ">=3.11"
dependencies = [
  "leo-orchestrator",
  "rich>=13.7,<15",
  "prompt_toolkit>=3.0.43,<4",
  "keyring>=25,<26",
]

[project.scripts]
leocode = "leo_cli.app:main"
leo = "leo_cli.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["leo_cli"]

[tool.uv.sources]
leo-orchestrator = { workspace = true }
